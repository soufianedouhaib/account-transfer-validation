<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report, Account Transfer Validation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23387BF0'/%3E%3Cpath d='M9 16.4l4.9 4.9L23 12' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="page" id="main" hidden>
      <div class="page-head">
        <h1>Report</h1>
        <p id="report-lede">What was submitted, what a manager decided, and how long the workflow took.</p>
      </div>

      <section class="card report-card">
        <!-- The figures stay put whichever chapter is open, so the period's
             shape is always on screen while you read the detail. -->
        <div class="ribbon" id="ribbon">
          <div class="rb-figures">
          <div class="rb">
            <span class="rb-k">Approved</span>
            <span class="rb-v rb-ok" id="k-approved">—</span>
            <span class="rb-s" id="k-approved-sub">—</span>
          </div>
          <div class="rb">
            <span class="rb-k">Rejected</span>
            <span class="rb-v rb-bad" id="k-rejected">—</span>
            <span class="rb-s" id="k-rejected-sub">—</span>
          </div>
          <div class="rb">
            <span class="rb-k">Approved share</span>
            <span class="rb-v" id="k-rate">—</span>
            <span class="rb-s">of decided value</span>
          </div>
          <div class="rb">
            <span class="rb-k">Runs</span>
            <span class="rb-v" id="k-count">—</span>
            <span class="rb-s" id="k-count-sub">—</span>
          </div>
          <div class="rb">
            <span class="rb-k">Average run time</span>
            <span class="rb-v" id="k-speed">—</span>
            <span class="rb-s" id="k-speed-sub">—</span>
          </div>

          </div>

          <div class="rb-controls">
            <select id="filter-preset" aria-label="Period">
              <option value="this-month" selected>This month</option>
              <option value="today">Today</option>
              <option value="last-month">Last month</option>
              <option value="last-90">Last 90 days</option>
              <option value="month">A specific month</option>
              <option value="custom">Custom dates</option>
              <option value="">All time</option>
            </select>
            <input type="month" id="filter-month" hidden aria-label="Month" />
            <span id="custom-wrap" hidden>
              <input type="date" id="filter-from" aria-label="From" />
              <input type="date" id="filter-to" aria-label="To" />
            </span>
            <select id="filter-currency" aria-label="Currency" hidden></select>
            <a class="btn btn-quiet btn-small" id="export-link" href="/api/export.csv">Export CSV</a>
          </div>
        </div>

        <div class="chapters">
          <nav class="chapter-list" id="chapter-list" aria-label="Report chapters"></nav>
          <div class="chapter-body" id="chapter-body" aria-live="polite"></div>
        </div>
      </section>

      <p class="notice notice-warn" id="report-note" hidden></p>
    </main>

    <footer class="footer" id="footer"></footer>

    <!-- The panels are templates rather than strings built in the script, so
         the markup stays readable and the script only fills slots. -->
    <template id="tpl-headline">
      <div class="ch-panel">
        <div class="ch-head">
          <div>
            <p class="ch-eyebrow" data-slot="period">—</p>
            <h2 class="ch-title">The period at a glance</h2>
          </div>
        </div>
        <div class="headline">
          <div class="headline-nums">
            <div class="big big-ok" data-slot="approved">0</div>
            <p class="big-sub" data-slot="approved-sub">—</p>
            <div class="big big-bad" data-slot="rejected">0</div>
            <p class="big-sub" data-slot="rejected-sub">—</p>
          </div>
          <figure class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120" role="img" data-slot="ring-label">
              <circle class="ring-track" cx="60" cy="60" r="48"></circle>
              <circle class="ring-arc" cx="60" cy="60" r="48" data-slot="arc"></circle>
              <text class="ring-pct" x="60" y="57" text-anchor="middle" data-slot="pct">0%</text>
              <text class="ring-cap" x="60" y="76" text-anchor="middle">approved</text>
            </svg>
            <figcaption class="ring-note" data-slot="ring-note">—</figcaption>
          </figure>
        </div>
        <div class="head-facts" data-slot="facts"></div>
      </div>
    </template>

    <template id="tpl-months">
      <div class="ch-panel">
        <div class="ch-head">
          <div>
            <p class="ch-eyebrow">Over time</p>
            <h2 class="ch-title" data-slot="title">Month by month</h2>
          </div>
          <div class="legend" data-slot="legend"></div>
        </div>
        <div class="chart-wrap">
          <div data-slot="chart"></div>
        </div>
        <p class="empty" data-slot="empty" hidden><strong>Nothing to plot yet</strong>No runs were decided in this period.</p>
        <details class="chart-data">
          <summary>See the numbers</summary>
          <div class="table-wrap">
            <table class="data-table" id="chart-table">
              <thead><tr><th>Month</th><th class="num">Approved</th><th class="num">Rejected</th><th class="num">Runs</th></tr></thead>
              <tbody data-slot="table"></tbody>
            </table>
          </div>
        </details>
      </div>
    </template>

    <template id="tpl-rank">
      <div class="ch-panel">
        <div class="ch-head">
          <div>
            <p class="ch-eyebrow" data-slot="eyebrow">—</p>
            <h2 class="ch-title" data-slot="title">—</h2>
          </div>
          <div class="legend" data-slot="legend"></div>
        </div>
        <div class="rank" data-slot="rank"></div>
        <p class="empty" data-slot="empty" hidden><strong>Nothing to rank yet</strong>No decided runs in this period.</p>
      </div>
    </template>

    <template id="tpl-waiting">
      <div class="ch-panel">
        <div class="ch-head">
          <div>
            <p class="ch-eyebrow">Still waiting</p>
            <h2 class="ch-title" data-slot="title">—</h2>
          </div>
        </div>
        <div class="waiting-list" data-slot="list"></div>
        <p class="empty" data-slot="empty" hidden><strong>Nothing is waiting</strong>Every finished run in this period has a decision on it.</p>
      </div>
    </template>

    <script src="/common.js"></script>
    <script src="/report.js"></script>
  </body>
</html>
